name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run repository checks
        env:
          FINSEC_CHECK_PYTHON: python
        run: ./scripts/check.sh
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Verify packaged report template
        run: python -c "from importlib.resources import files; assert files('finsec.reporting.templates').joinpath('report.md.j2').is_file()"
