name: Synthetic Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run isolated end-to-end validation
        env:
          FINSEC_CHECK_PYTHON: python
        run: ./scripts/check.sh --synthetic
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-validation-results
          path: /tmp/finsec-synthetic-validation/results
          if-no-files-found: warn
