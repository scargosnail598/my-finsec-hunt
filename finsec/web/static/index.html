<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta
      name="description"
      content="Local research cockpit for FinSec Hunt workspaces."
    >
    <title>FinSec Hunt - Research Cockpit</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="app-shell">
      <aside class="rail" aria-label="Application navigation">
        <a class="brand" href="#overview" aria-label="FinSec Hunt overview">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>FINSEC</strong>
            <small>HUNT / LOCAL</small>
          </span>
        </a>

        <div class="workspace-control">
          <label for="workspace-select">Research workspace</label>
          <div class="select-wrap">
            <select id="workspace-select" aria-label="Research workspace"></select>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 10 5 5 5-5"></path>
            </svg>
          </div>
          <p id="workspace-path">Loading local workspaces...</p>
        </div>

        <nav class="primary-nav">
          <button class="nav-item is-active" data-view="overview" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"></path>
            </svg>
            <span>Overview</span>
          </button>
          <button class="nav-item" data-view="hypotheses" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 3.5 7.5 12 12l8.5-4.5L12 3Z"></path>
              <path d="m3.5 12 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"></path>
            </svg>
            <span>Hypotheses</span>
          </button>
          <button class="nav-item" data-view="endpoints" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M15 8l4 4-4 4"></path>
              <circle cx="5" cy="12" r="2"></circle>
            </svg>
            <span>Endpoints</span>
          </button>
          <button class="nav-item" data-view="model" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="5" r="2.5"></circle>
              <circle cx="5" cy="18" r="2.5"></circle>
              <circle cx="19" cy="18" r="2.5"></circle>
              <path d="m10.5 7-4 8.5M13.5 7l4 8.5M7.5 18h9"></path>
            </svg>
            <span>Model</span>
          </button>
          <button class="nav-item" data-view="evidence" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3h8l4 4v14H7V3Z"></path>
              <path d="M15 3v5h5M10 13h6M10 17h6"></path>
            </svg>
            <span>Evidence</span>
          </button>
          <button class="nav-item" data-view="documents" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"></path>
              <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"></path>
            </svg>
            <span>Scope &amp; Notes</span>
          </button>
        </nav>

        <div class="safety-card">
          <div class="safety-status"><span></span> READ-ONLY UI</div>
          <p>Local workspace data only. No target requests can be sent from this interface.</p>
        </div>
      </aside>

      <main class="main-stage">
        <header class="topbar">
          <div>
            <p class="breadcrumb">FINSEC HUNT <span>/</span> <b id="view-label">OVERVIEW</b></p>
            <p class="updated" id="updated-label">Waiting for workspace data</p>
          </div>
          <div class="topbar-actions">
            <span class="local-badge"><i></i> LOCALHOST</span>
            <button class="icon-button" id="refresh-button" type="button" title="Refresh data">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 7v5h-5"></path>
                <path d="M4 17v-5h5"></path>
                <path d="M6.1 9A7 7 0 0 1 18 6l2 1M18 15a7 7 0 0 1-11.9 3L4 17"></path>
              </svg>
              <span class="sr-only">Refresh data</span>
            </button>
          </div>
        </header>

        <section id="content" class="content" aria-live="polite">
          <div class="loading-state">
            <div class="loader-mark"><span></span><span></span><span></span></div>
            <p>Reading local research state...</p>
          </div>
        </section>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="detail-drawer" id="detail-drawer" aria-label="Record details" aria-hidden="true">
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close details">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
      </button>
      <div id="drawer-content"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">This local interface requires JavaScript to render workspace data.</div>
    </noscript>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
