# Fully reviewed hard-edge ground truth. The production runner never opens this file.
edges:
  - id: rl-001
    journey: resource-lifecycle
    producer: create_order
    consumer: read_order_1
    field_name: orderId
    resource_type: order
    relationship: CAUSAL_HARD
    expected_basis: RESOURCE_CREATED
    status: expected
    reason: The created order identity is explicitly consumed by the first resource read.
    distinctive: true

  - id: rl-002
    journey: resource-lifecycle
    producer: create_order
    consumer: confirm_order
    field_name: orderId
    resource_type: order
    relationship: CAUSAL_HARD
    expected_basis: RESOURCE_CREATED
    status: expected
    reason: Confirmation consumes the output-only order identity.
    distinctive: true

  - id: rl-003
    journey: resource-lifecycle
    producer: create_order
    consumer: read_order_2
    field_name: orderId
    resource_type: order
    relationship: CAUSAL_HARD
    expected_basis: RESOURCE_CREATED
    status: expected
    reason: The final read still references the resource created by create_order.
    distinctive: true

  - id: rl-004
    journey: resource-lifecycle
    producer: confirm_order
    consumer: read_order_2
    field_name: orderId
    resource_type: order
    relationship: CONTEXT_SOFT
    expected_basis: REQUEST_VALUE_ECHOED
    status: forbidden
    reason: Confirmation echoes an existing identifier and does not produce a new one.
    request_echo: true

