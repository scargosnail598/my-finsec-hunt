# ============================================================================
# ADVERSARIAL JOURNEY (Forbidden Edges)
# ============================================================================

  - id: "adv-001"
    journey: "adversarial"
    producer: "post_order"
    consumer: "post_report"
    field_name: "total"
    relationship: "CONTEXT_SOFT"
    expected_basis: "AMBIGUOUS_ORIGIN"
    status: "forbidden"
    reason: "Coincidental numeric value (50.00) across unrelated resources; must not merge workflows"
    coincidental: true
    same_value_different_semantics: true

  - id: "adv-002"
    journey: "adversarial"
    producer: "post_order"
    consumer: "get_report_details"
    field_name: "orderId (numeric part) vs reportId"
    relationship: "CONTEXT_SOFT"
    expected_basis: "AMBIGUOUS_ORIGIN"
    status: "forbidden"
    reason: "Coincidental numeric equality (100) in different resource types; must not create edge"
    coincidental: true

  - id: "adv-003"
    journey: "adversarial"
    producer: "post_shipment"
    consumer: "post_report"
    field_name: "status"
    value: "ACTIVE"
    relationship: "CONTEXT_SOFT"
    expected_basis: "AMBIGUOUS_ORIGIN"
    status: "forbidden"
    reason: "Generic enum value (ACTIVE) appears in multiple resources; must not create causal edge"
    generic_value: true

  - id: "adv-004"
    journey: "adversarial"
    producer: "post_shipment"
    consumer: "get_report_details"
    field_name: "status"
    value: "ACTIVE"
    relationship: "CONTEXT_SOFT"
    expected_basis: "AMBIGUOUS_ORIGIN"
    status: "forbidden"
    reason: "Generic status value across unrelated resources"
    generic_value: true

  - id: "adv-005"
    journey: "adversarial"
    producer: "get_account"
    consumer: "post_transfer"
    field_name: "accountId"
    value: "ACC-500"
    relationship: "CONTEXT_SOFT"
    expected_basis: "EXISTING_VALUE_OBSERVED"
    status: "forbidden"
    reason: "Read-before-write: GET does not establish production; POST produces the state change"
    read_before_write: true

  - id: "adv-006"
    journey: "adversarial"
    producer: "payment_customer_b"
    consumer: "payment_customer_a"
    field_name: "paymentId"
    value_from: "PAY-501"
    value_to: "PAY-502"
    relationship: "CROSS_ACTOR_COMPARISON"
    expected_basis: "AMBIGUOUS_ORIGIN"
    status: "forbidden"
    reason: "Cross-actor payment IDs must not merge; different controlled actors"
    cross_actor: true

# ============================================================================
# Expected Isolated Workflow Components (Adversarial)
# ============================================================================

isolated_workflows:
  - id: "adv-wf-1"
    name: "Order + Shipment"
    observations: ["post_order", "post_shipment"]
    expected_components: 1
    reason: "Same actor, orderId link"

  - id: "adv-wf-2"
    name: "Report + Report Details"
    observations: ["post_report", "get_report_details"]
    expected_components: 1
    reason: "Same actor, resource ID link"

  - id: "adv-wf-3"
    name: "Account + Transfer"
    observations: ["get_account", "post_transfer"]
    expected_components: 1
    reason: "Same actor, same resource (accountId), scoped by read then modified"

  - id: "adv-wf-b"
    name: "Payment (Customer B)"
    observations: ["payment_customer_b"]
    expected_components: 1
    reason: "Customer B only; isolated by actor"

  - id: "adv-wf-a"
    name: "Payment (Customer A)"
    observations: ["payment_customer_a"]
    expected_components: 1
    reason: "Customer A payment; different actor from wf-b"
