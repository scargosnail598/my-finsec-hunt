# Prerequisites and Ordering Ground Truth
#
# This file documents expected prerequisites (true dependencies)
# and forbidden adjacencies (false implied ordering).

prerequisites:

  # ========================================================================
  # RESOURCE-LIFECYCLE
  # ========================================================================

  - id: "rl-p-001"
    journey: "resource-lifecycle"
    dependent_action: "confirm_order"
    prerequisite_action: "create_order"
    field: "orderId"
    status: "expected"
    confidence: "HIGH_EVIDENCE"
    reason: "orderId must be created before it can be confirmed"
    evidence:
      - "orderId is produced in create_order response"
      - "orderId is consumed in confirm_order request"
      - "Same resource type and value"

  - id: "rl-p-002"
    journey: "resource-lifecycle"
    dependent_action: "read_order_1"
    prerequisite_action: "create_order"
    field: "orderId"
    status: "forbidden"
    confidence: "HIGH_EVIDENCE"
    reason: "read_order_1 does not create a causal prerequisite; orderId originates from create_order"
    note: "GET operations read existing resources; they don't establish production"

