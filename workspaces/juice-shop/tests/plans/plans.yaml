- id: TEST-004
  key: plan:HYP-012
  hypothesis_id: HYP-012
  purpose: Safely evaluate Potential cross-account Addresss modification through addresssId
    on PUT /api/Addresss/{addresssId} without expanding beyond minimum proof.
  risk:
    destructive: false
    financial: false
    affects_external_user: false
    concurrency: false
    request_budget: 2
    decision: REQUIRES_HUMAN_APPROVAL
    reasons:
    - Static policy checks pass; explicit human approval is still mandatory.
  accounts:
    object_owner: mrscargo
    actor: saeedmehmandoust
  preconditions:
  - Both accounts and the target object belong to the researcher.
  - Account A owns a non-sensitive test Addresss in a safe state.
  - Account B can reproduce the same operation against its own object when applicable.
  setup:
  - mrscargo creates or selects the test object.
  - Record object ownership and initial state.
  - Authenticate separately as saeedmehmandoust.
  actions:
  - Copy the successful PUT /api/Addresss/{addresssId} request for Account B's own
    object when available.
  - Replace only the object identifier with Account A's researcher-owned identifier.
  - Submit exactly one modified request.
  - Retrieve the object again as Account A to verify state and ownership.
  secure_assertions:
  - The modified request is rejected without exposing Account A data.
  - Account A's object state remains unchanged.
  interesting_behavior:
  - The server returns Account A's Addresss data or applies the requested operation
    to Account A's object.
  - Unexpected status codes alone are not proof; verify data or authoritative state.
  evidence_to_capture:
  - Account A ownership evidence for the test object.
  - Account B redacted request containing only the substituted identifier.
  - Server response and Account A before/after state.
  stop_conditions:
  - Any unrelated user data becomes visible.
  - Any financial movement exceeds the explicitly approved test value.
  - The operation affects an external user or irreversible state.
  - Rate limiting, instability, or an unexpected side effect appears.
  - The minimum evidence needed to classify behavior has been collected.
  cleanup:
  - Restore or cancel only researcher-owned reversible test state when permitted.
  - Store only redacted evidence and keep credentials outside the workspace.
  requests: []
  authentication: []
  execution:
    supported: false
    pattern: UNSUPPORTED
    blockers:
    - Object substitution execution supports GET or HEAD read-only endpoints.
    - Two controlled actor-object-owner baselines are required for execution.
    - addresssId is not allowlisted as a trusted ownership scope parameter.
    request_budget: 0
    parallelism: 1
    mutation_dimensions: []
    follow_redirects: false
    tls_verification: true
    connection_timeout_seconds: 5.0
    read_timeout_seconds: 10.0
    maximum_response_bytes: 2097152
    stop_conditions:
    - baseline request fails
    - unexpected HTTP 5xx
    - response size limit is exceeded
    - redirect destination is out of scope
    - DNS resolves to a prohibited destination
    - TLS validation fails
    - baseline object identity does not match
    - request budget would be exceeded
    - more than one mutation dimension is present
    - an unexpected state-changing response is detected
    - the researcher interrupts execution
  human_approval_required: true
  execution_default: DO_NOT_EXECUTE
  approval_status: NOT_REQUESTED
  status: BLOCKED
