target:
  name: divar
  type: fintech
scope:
  hosts: []
accounts: []
testing:
  production: false
  human_approval_required: true
  destructive_testing: false
restrictions:
  denial_of_service: false
  brute_force: false
  social_engineering: false
  spam: false
  destructive_actions: false
analysis:
  include_hosts: []
  exclude_hosts: []
  suppress:
    static_assets: true
    telemetry: true
    analytics: true
    third_party: true
  excluded_extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
  - ico
  - css
  - js
  - map
  - woff
  - woff2
  - ttf
  - eot
  - mp4
  - webm
  excluded_path_patterns:
  - /static/
  - /assets/
  - /images/
  - /img/
  - /fonts/
  - /css/
  - /js/
  - /media/
  - /gen_204
  - /envelope/
  - /client-exporter/
  - /actionlog/
  hypothesis_gates:
    bola_minimum_score: 6
    state_transition_minimum_score: 7
    financial_minimum_score: 5
  classification_overrides: {}
focus:
- authorization
- business_logic
- financial_workflows
- authentication
- race_conditions
