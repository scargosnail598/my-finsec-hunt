  - Account A owns a non-sensitive test WebpThumbnail in a safe state.
  - Account B can reproduce the same operation against its own object when applicable.
  setup:
  - Researcher Account A creates or selects the test object.
  - Record object ownership and initial state.
  - Authenticate separately as Researcher Account B.
