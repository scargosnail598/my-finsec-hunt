  required_state:
  - Researcher Account A owns a reachable Basket object.
  attacker_capability:
  - Can request Basket objects without an observed request credential.
  - Can substitute one researcher-controlled actor's basketId into another baseline.
  evidence_status: INFERRED
  hypothesis: An unauthenticated caller may be able to substitute another account's
    basketId with GET /rest/basket/{basketId} and cross the Basket ownership boundary.
  reasoning: 2 researcher-controlled actors were passively observed retrieving distinct
    Basket objects through basketId. Successful JSON responses matched the requested
    object IDs and contained 2 distinct UserId values. No request authentication credential
    was observed. Cross-substitution has not yet been tested.
  preconditions:
  - Both accounts and the target object belong to the researcher.
  - Account A owns a non-sensitive test Basket in a safe state.
  - Account B can reproduce the same operation against its own object when applicable.
  expected_secure_behavior: The server rejects Account B's request and leaves Account
    A's object and data unchanged.
  possible_vulnerable_behavior: The server returns Account A's Basket data or applies
    the requested operation to Account A's object.
  potential_impact:
    confidentiality: high
    integrity: none
    availability: none
    financial: unknown
  evidence_to_collect:
  - Account A ownership evidence for the test object.
  - Account B redacted request containing only the substituted identifier.
  - Server response and Account A before/after state.
  eligibility_evidence:
  - first-party JSON API
