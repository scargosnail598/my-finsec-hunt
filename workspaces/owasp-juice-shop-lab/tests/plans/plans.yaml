version: 1
plans:
- id: TEST-001
  key: plan:HYP-002
  hypothesis_id: HYP-002
  purpose: Safely evaluate Potential unauthenticated cross-account Basket access through
    basketId on GET /rest/basket/{basketId} without expanding beyond minimum proof.
  risk:
    destructive: false
    financial: false
    affects_external_user: false
    concurrency: false
    request_budget: 2
    decision: REQUIRES_HUMAN_APPROVAL
    reasons:
    - Static policy checks pass; explicit human approval is still mandatory.
  accounts:
    object_owner: saeedmehmandoust
    actor: mrscargo
  preconditions:
  - Both accounts and the target object belong to the researcher.
  - Account A owns a non-sensitive test Basket in a safe state.
  - Account B can reproduce the same operation against its own object when applicable.
  setup:
  - saeedmehmandoust creates or selects the test object.
  - Record object ownership and initial state.
  - Authenticate separately as mrscargo.
  actions:
  - Copy the successful GET /rest/basket/{basketId} request for Account B's own object
    when available.
  - Replace only the object identifier with Account A's researcher-owned identifier.
  - Submit exactly one modified request.
  - Retrieve the object again as Account A to verify state and ownership.
  secure_assertions:
  - The modified request is rejected without exposing Account A data.
  - Account A's object state remains unchanged.
  interesting_behavior:
  - The server returns Account A's Basket data or applies the requested operation
    to Account A's object.
  - Unexpected status codes alone are not proof; verify data or authoritative state.
  evidence_to_capture:
  - Account A ownership evidence for the test object.
  - Account B redacted request containing only the substituted identifier.
  - Server response and Account A before/after state.
  stop_conditions:
  - Any unrelated user data becomes visible.
  - Any financial movement exceeds the explicitly approved test value.
  - The operation affects an external user or irreversible state.
  - Rate limiting, instability, or an unexpected side effect appears.
  - The minimum evidence needed to classify behavior has been collected.
  cleanup:
  - Restore or cancel only researcher-owned reversible test state when permitted.
  - Store only redacted evidence and keep credentials outside the workspace.
