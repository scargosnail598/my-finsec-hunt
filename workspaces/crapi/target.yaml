analysis:
  include_hosts:
  - crapi.local
  exclude_hosts: []
  suppress:
    static_assets: true
    telemetry: true
    analytics: true
    third_party: true
  excluded_extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
  - ico
  - css
  - js
  - map
  - woff
  - woff2
  - ttf
  - eot
  - mp4
  - webm
  excluded_path_patterns:
  - /static/
  - /assets/
  - /images/
  - /img/
  - /fonts/
  - /css/
  - /js/
  - /media/
  - /gen_204
  - /envelope/
  - /client-exporter/
  - /actionlog/
  hypothesis_gates:
    bola_minimum_score: 6
    state_transition_minimum_score: 7
    financial_minimum_score: 5
  ownership_inference:
    trusted_parent_parameters:
    - accountId
    - tenantId
    - organizationId
    - orgId
    - workspaceId
    - customerId
    public_shared_parameters:
    - regionId
    - zoneId
    - productId
    - planId
    - categoryId
    - countryId
    - languageId
  function_authorization_rules:
  - method: POST
    path: /workshop/api/shop/products
    resource: Product
    allowed_roles:
    - admin
    rationale: Product creation is restricted to administrators or privileged users.
  jwt_algorithm_rules:
  - method: POST
    path: /identity/api/auth/verify
    token_location: body
    token_parameter: token
    rejected_algorithms:
    - none
    rationale: Unsigned JWTs must never satisfy token verification or authorize modified claims.
  classification_overrides: {}
focus:
- authorization
